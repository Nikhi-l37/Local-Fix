steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/localfix-backend', './backend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/localfix-backend']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - localfix-backend
      - --image=gcr.io/$PROJECT_ID/localfix-backend
      - --region=asia-south1
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=MONGODB_URI=$$MONGODB_URI,GEMINI_API_KEY=$$GEMINI_API_KEY,FIREBASE_PROJECT_ID=$$FIREBASE_PROJECT_ID,FIREBASE_PRIVATE_KEY=$$FIREBASE_PRIVATE_KEY,FIREBASE_CLIENT_EMAIL=$$FIREBASE_CLIENT_EMAIL
